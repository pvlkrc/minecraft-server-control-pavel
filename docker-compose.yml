services:
  minecraft:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      # RCON (25575) is NOT published. Only containers in this Compose
      # network (the api) can reach it as minecraft:25575.
    environment:
      EULA: "TRUE"
      MEMORY: "4096M"
      DIFFICULTY: "3"
      SPAWN_PROTECTION: "6"
      RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in .env}
      RCON_PORT: ${RCON_PORT:-25575}
    volumes:
      - "./data:/data"

  api:
    # Built by GitHub Actions (.github/workflows/api-image.yml).
    # Update: docker compose pull api && docker compose up -d
    # Local build instead: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
    image: ${API_IMAGE:-ghcr.io/pvlkrc/minecraft-server-control-pavel}:${API_TAG:-latest}
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      RCON_HOST: minecraft
      RCON_PORT: ${RCON_PORT:-25575}
      RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in .env}
      PANEL_USER: ${PANEL_USER:-admin}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?set PANEL_PASSWORD in .env}
      DATA_DIR: /data
      DOCKER_URL: http://docker-proxy:2375
    volumes:
      # The api reads whitelist/bans/ops/logs/level.dat. It writes only
      # server.properties (allowed keys). Game changes go via RCON.
      - "./data:/data"
    ports:
      # Default: only this computer. Set PANEL_BIND=0.0.0.0 in .env for LAN access.
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8000}:8000"
    networks:
      - default
      - docker-api

  # Read-only Docker API for CPU / RAM / uptime. Only GET on containers is
  # allowed; the api never sees the real Docker socket. Not published, and
  # only reachable from the api (separate internal network).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

networks:
  docker-api:
    internal: true
